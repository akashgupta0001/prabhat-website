<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#0B1A3B;--blue:#1F5FD6;--ink:#14213D;--muted:#66758C;--line:#E2E8F1;--bg:#F2F5FA;--red:#DC2626}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1226;--ink:#E6ECF7;--muted:#8FA0BB;--line:#22304E}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:Canvas;color:CanvasText;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(11,26,59,.12)}
.lg{display:flex;align-items:center;gap:12px;margin-bottom:20px}.lg i{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 24px/1 Inter,sans-serif;font-style:normal}
.lg b{display:block;letter-spacing:.04em}.lg small{color:var(--muted);letter-spacing:.12em;font-size:11px}
h1{font-size:19px;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:14px}input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:Field;color:FieldText}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);min-height:20px;margin:0 0 10px;font-size:13px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="lg"><i>P</i><div><b>PRABHAT INDUSTRIES</b><small>CONTROL PANEL</small></div></div>
  <h1>Sign in</h1><p>Enter your administrator username and password.</p>
  <label>Username<input name="username" id="u" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" id="p" type="password" autocomplete="current-password" required></label>
  <p class="err" id="e" role="alert"></p>
  <button id="b" type="submit">Sign in</button>
</form>
<script>
fetch('/api/me',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){
  if(j.user){location.replace('/admin/');return}
  if(!j.configured)document.getElementById('e').textContent='Login is not set up yet. Add ADMIN_USER and ADMIN_PASSWORD in Cloudflare (see SETUP.md).';
}).catch(function(){});
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');e.textContent='';b.disabled=true;
  fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-requested-with':'pi-admin'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(x){if(x.ok){location.replace('/admin/')}else{e.textContent=x.j.error||'Sign-in failed.';b.disabled=false}})
  .catch(function(){e.textContent='Could not reach the server. Check your connection.';b.disabled=false});
});
</script>
</body>
</html>
